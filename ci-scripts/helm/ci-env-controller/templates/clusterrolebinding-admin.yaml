# The controller creates a per-test ClusterRoleBinding to cluster-admin for the
# console ServiceAccount. Kubernetes only allows granting permissions the
# caller already holds, so the controller ServiceAccount must be cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-controller-admin
  labels:
    {{- include "ci-env-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-controller
    namespace: {{ .Release.Namespace }}
