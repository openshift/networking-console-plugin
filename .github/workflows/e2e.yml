name: E2E Tests

on:
  pull_request:
    branches: [main, release-*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BRIDGE_BASE_ADDRESS: ${{ secrets.CONSOLE_URL }}
      BRIDGE_E2E_BROWSER_NAME: electron
      HIDE_XHR: 'true'
      TEST_NS: cy-test-ns
      UDN_NS: udn-test-ns

    steps:
      - name: Check CONSOLE_URL secret
        id: check
        env:
          CONSOLE_URL: ${{ secrets.CONSOLE_URL }}
        run: |
          if [ -z "${CONSOLE_URL}" ]; then
            echo "::notice::CONSOLE_URL secret is not configured; skipping E2E"
            echo "run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "run=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: |
          npm clean-install --ignore-scripts --no-audit
          npx cypress install

      - name: Run E2E tests
        if: steps.check.outputs.run == 'true'
        run: npm run test-e2e

      - name: Upload test artifacts
        if: failure() && steps.check.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: ui-tests-cy/gui-test-screenshots/
          retention-days: 7
