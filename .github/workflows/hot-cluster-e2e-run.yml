name: Hot Cluster E2E Run

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to test (defaults to current branch)
        required: false
        type: string
      test_spec:
        description: Cypress test spec to run
        required: true
        default: tests/all.cy.ts
        type: string
  workflow_call:
    inputs:
      branch:
        description: Branch to test (defaults to current branch)
        type: string
        required: false
      test_spec:
        description: Cypress test spec to run
        type: string
        required: false
        default: tests/all.cy.ts

permissions:
  contents: read
  actions: read

env:
  TEST_NS: networking-ci-test-${{ github.run_id }}
  UDN_NS: networking-ci-udn-${{ github.run_id }}

  PLUGIN_IMAGE: 'ttl.sh/networking-console-plugin-ci-${{ github.run_id }}-${{ github.run_attempt }}:2h'

  CI_ENV_NS: ci-env
  CI_ENV_CM: ci-env-${{ github.run_id }}

jobs:
  check-runner:
    name: Check Runner Image
    runs-on: networking-console-plugin-ci
    timeout-minutes: 15
    env:
      OPENSSL_FORCE_FIPS_MODE: '0'
      GOLANG_FIPS: '0'
      KUBECONFIG: /tmp/kubeconfig
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}
          persist-credentials: false

      - name: Install oc CLI
        uses: ./.github/actions/install-oc

      - name: Set up kubeconfig from ServiceAccount token
        uses: ./.github/actions/setup-kubeconfig
        with:
          fail-if-missing: 'false'

      - name: Log runner environment
        uses: ./.github/actions/log-runner-env

  build-plugin-image:
    name: Build Plugin Image
    runs-on: ubuntu-latest
    outputs:
      plugin-image: ${{ env.PLUGIN_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Build plugin image
        uses: ./.github/actions/build-plugin-image
        with:
          plugin-image: ${{ env.PLUGIN_IMAGE }}

  run-e2e-tests:
    name: Run E2E Tests
    needs: [check-runner, build-plugin-image]
    runs-on: networking-console-plugin-ci
    timeout-minutes: 60
    concurrency:
      group: hot-cluster-e2e-${{ github.ref }}
      cancel-in-progress: true
    env:
      BRIDGE_E2E_BROWSER_NAME: electron
      OPENSSL_FORCE_FIPS_MODE: '0'
      GOLANG_FIPS: '0'
      KUBECONFIG: /tmp/kubeconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Install oc CLI
        uses: ./.github/actions/install-oc

      - name: Set up kubeconfig from ServiceAccount token
        uses: ./.github/actions/setup-kubeconfig

      - name: Verify cluster connectivity
        run: oc cluster-info

      - name: Provision CI test environment
        id: ci-env
        uses: ./.github/actions/ci-env-request
        with:
          plugin-image: ${{ env.PLUGIN_IMAGE }}
          test-namespace: ${{ env.TEST_NS }}
          configmap-name: ${{ env.CI_ENV_CM }}
          ci-env-namespace: ${{ env.CI_ENV_NS }}

      - name: Set up test namespaces
        uses: ./.github/actions/setup-test-namespaces
        with:
          test-namespace: ${{ env.TEST_NS }}
          udn-namespace: ${{ env.UDN_NS }}

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit
          npx cypress install

      - name: Run E2E tests
        uses: cypress-io/github-action@v6
        env:
          BRIDGE_BASE_ADDRESS: ${{ steps.ci-env.outputs.bridge-base-address }}
        with:
          summary-title: 'Networking E2E tests'
          install: false
          working-directory: ./ui-tests-cy
          env: openshift=true
          spec: '${{ inputs.test_spec }}'

      - name: Generate test report
        if: always()
        run: npm run cypress-postreport || true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-results-${{ github.run_id }}
          path: ui-tests-cy/gui-test-screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect CI diagnostics
        if: always()
        uses: ./.github/actions/collect-ci-diagnostics
        with:
          test-namespace: ${{ env.TEST_NS }}
          configmap-name: ${{ env.CI_ENV_CM }}
          ci-env-namespace: ${{ env.CI_ENV_NS }}

      - name: Clean up test resources
        if: always()
        run: bash ci-scripts/test-cleanup.sh

      - name: Release CI test environment
        if: always()
        uses: ./.github/actions/ci-env-release
        with:
          configmap-name: ${{ env.CI_ENV_CM }}
          ci-env-namespace: ${{ env.CI_ENV_NS }}
