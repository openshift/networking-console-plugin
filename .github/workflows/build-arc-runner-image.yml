name: Build Custom ARC Runner Image

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Target registry
        required: true
        default: quay.io
        type: choice
        options:
          - quay.io
          - docker.io
      image_name:
        description: Image name (without registry)
        required: true
        default: rhn_support_lkladnit/networking-console-plugin-arc-runner
      tag:
        description: Image tag
        required: true
        default: latest
  push:
    paths:
      - 'ci-scripts/Dockerfile.arc-runner'
      - 'ci-scripts/ARC-RUNNER-IMAGE.md'
      - '.github/workflows/build-arc-runner-image.yml'
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ${{ github.event.inputs.registry || 'quay.io' }}
  IMAGE_NAME: ${{ github.event.inputs.image_name || 'rhn_support_lkladnit/networking-console-plugin-arc-runner' }}
  TAG: ${{ github.event.inputs.tag || 'latest' }}

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        if: env.REGISTRY == 'quay.io'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Determine image reference
        id: image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"
          echo "reference=${IMAGE}" >> $GITHUB_OUTPUT
          echo "Building image: ${IMAGE}"

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ci-scripts/Dockerfile.arc-runner
          push: false
          load: true
          tags: ${{ steps.image.outputs.reference }}

      - name: Verify image
        run: |
          IMAGE="${{ steps.image.outputs.reference }}"
          echo "=== Image Verification ==="
          docker run --rm "${IMAGE}" sh -c "
            echo '✓ oc:' \$(oc version --client 2>&1 | head -1)
            echo '✓ kubectl:' \$(kubectl version --client 2>&1 | grep -o 'v[0-9.]*')
            echo '✓ helm:' \$(helm version --short)
            echo '✓ node:' \$(node --version)
            echo '✓ npm:' \$(npm --version)
            echo '✓ cypress:' \$(cypress --version)
            echo '✓ git:' \$(git --version | head -1)
            echo '✓ jq:' \$(jq --version)
          "

      - name: Push to registry (GitHub-triggered)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ci-scripts/Dockerfile.arc-runner
          push: true
          tags: ${{ steps.image.outputs.reference }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to registry (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker push ${{ steps.image.outputs.reference }}

      - name: Log image reference
        run: |
          {
            echo "<details><summary>Custom ARC Runner Image</summary>"
            echo ""
            echo "**Image**: \`${{ steps.image.outputs.reference }}\`"
            echo ""
            echo "**Usage in RunnerScaleSet**:"
            echo ""
            echo "\`\`\`yaml"
            echo "spec:"
            echo "  runnerImage: ${{ steps.image.outputs.reference }}"
            echo "  template:"
            echo "    spec:"
            echo "      containers:"
            echo "        - name: runner"
            echo "          image: ${{ steps.image.outputs.reference }}"
            echo "\`\`\`"
            echo ""
            echo "**To apply**:"
            echo ""
            echo "\`\`\`bash"
            echo "oc patch runnerscaleset/networking-console-plugin-ci -n arc-runners --type merge -p '{\"spec\":{\"runnerImage\":\"${{ steps.image.outputs.reference }}\"}'"
            echo "oc rollout restart statefulset/arc-runner -n arc-runners"
            echo "\`\`\`"
            echo ""
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
