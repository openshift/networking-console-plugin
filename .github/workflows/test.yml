name: Test

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run linter and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm clean-install --ignore-scripts --no-audit

      - name: Lint
        run: npm run lint

      - name: Check i18n
        run: ./test-frontend.sh

      - name: Test
        run: npm run test:coverage

      # Fails the build if the fixture sanitizer stops refusing identity-bearing
      # payloads or starts redacting whole recordings into empty ones.
      - name: Test (sanitizer)
        run: npm run test:sanitizer

      # Renders real components against recorded cluster payloads, so it needs no
      # cluster; the ESM flags msw 3 requires are set by the npm script.
      - name: Test (integration)
        run: npm run test:integration

      - name: Build
        run: npm run build
