name: Hot Cluster E2E

on:
  workflow_dispatch:
    inputs:
      test_spec:
        description: Cypress test spec to run
        required: true
        default: tests/all.cy.ts
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hot-cluster-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-e2e-tests:
    name: Run E2E Tests
    uses: ./.github/workflows/hot-cluster-e2e-run.yml
    with:
      test_spec: ${{ inputs.test_spec }}
    secrets: inherit
