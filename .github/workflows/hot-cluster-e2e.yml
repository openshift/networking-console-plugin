name: Hot Cluster E2E

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to test (defaults to current branch)
        required: false
        type: string
      test_spec:
        description: Cypress test spec to run
        required: true
        default: tests/all.cy.ts
        type: string

permissions:
  contents: read
  actions: read

jobs:
  run-e2e-tests:
    name: Run E2E Tests
    uses: ./.github/workflows/hot-cluster-e2e-run.yml
    with:
      branch: ${{ inputs.branch || github.ref_name }}
      test_spec: ${{ inputs.test_spec }}
    secrets: inherit
