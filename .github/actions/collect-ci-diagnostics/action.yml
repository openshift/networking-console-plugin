name: Collect CI diagnostics
description: >
  Collect console/plugin pod logs and, on failure, cluster nodes, events,
  and pods. Upload the bundle as a GitHub Actions artifact.

inputs:
  test-namespace:
    description: Namespace where the test stack is deployed
    required: true
  configmap-name:
    description: ci-env trigger ConfigMap name
    required: true
  ci-env-namespace:
    description: Namespace of the ci-env-controller
    required: false
    default: ci-env

runs:
  using: composite
  steps:
    - name: Collect CI diagnostics — pod logs
      if: always()
      shell: bash
      env:
        TEST_NS: ${{ inputs.test-namespace }}
        CI_ENV_CM: ${{ inputs.configmap-name }}
        CI_ENV_NS: ${{ inputs.ci-env-namespace }}
      run: |
        TMP=/tmp/e2e-ci-diagnostics/pod-logs
        mkdir -p "${TMP}"

        HELM_RELEASE="$(oc get configmap "${CI_ENV_CM}" -n "${CI_ENV_NS}" \
          -o jsonpath='{.data.helm-release}' 2>/dev/null || echo "${CI_ENV_CM}")"

        oc logs -n "${TEST_NS}" -l "app=${HELM_RELEASE}-console" --tail=-1 \
          > "${TMP}/console.log" 2>&1 || true
        oc logs -n "${TEST_NS}" -l "app=${HELM_RELEASE}-plugin" --tail=-1 \
          > "${TMP}/networking-plugin.log" 2>&1 || true

    - name: Collect CI diagnostics — cluster info
      if: failure()
      shell: bash
      env:
        TEST_NS: ${{ inputs.test-namespace }}
      run: |
        TMP=/tmp/e2e-ci-diagnostics/cluster
        mkdir -p "${TMP}"

        oc get nodes -o wide > "${TMP}/nodes.txt" 2>/dev/null || true
        oc get events -n "${TEST_NS}" --sort-by='.lastTimestamp' > "${TMP}/test_ns_events.txt" 2>/dev/null || true
        oc get pods -n "${TEST_NS}" -o wide > "${TMP}/test_ns_pods.txt" 2>/dev/null || true

    - name: Upload CI diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-ci-diagnostics-${{ github.run_id }}
        path: /tmp/e2e-ci-diagnostics/
        retention-days: 7
        if-no-files-found: ignore
