version: 2
updates:
  # Docker images are OpenShift CI streams, not Dependabot-managed
  # - package-ecosystem: docker

  # --- main (default branch) ---
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: 'maintenance'
    cooldown:
      default-days: 5
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: 'maintenance'
    cooldown:
      default-days: 5
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: UTC
    allow:
      - dependency-type: all
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      # ignore all shared modules provided by the Console >=4.19
      # modules currently provided by Console based on
      # https://github.com/openshift/console/blob/c46e0aabe4c9cf330f1e56ad323076e7e8e7f7d8/frontend/packages/console-dynamic-plugin-sdk/src/shared-modules/shared-modules-meta.ts#L41
      - dependency-name: '@openshift/dynamic-plugin-sdk'
      - dependency-name: '@openshift-console/dynamic-plugin-sdk'
      - dependency-name: '@openshift-console/dynamic-plugin-sdk-internal'
      # ignore all patternfly packages as they use their own per Component shared modules
      # https://redhat.atlassian.net/browse/OCPBUGS-127046
      - dependency-name: '@patternfly/*'
      - dependency-name: react
      - dependency-name: react-i18next
      - dependency-name: react-redux
      - dependency-name: react-router
      - dependency-name: react-router-dom
      - dependency-name: react-router-dom-v5-compat
      - dependency-name: redux
      - dependency-name: redux-thunk
       # not shared but effectively pinned to Console version
      - dependency-name: '@openshift-console/dynamic-plugin-sdk-webpack'
       # legacy lib seen on older branches
      - dependency-name: '@openshift/dynamic-plugin-sdk-webpack'
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - '*'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  # --- release branches ---
  # update also minor versions - reasoning is that:
  # a) usually the latest minor version is the only version that receives security updates
  # b) minor version should not contain breaking changes
  # ignore list covers all Console shared and shared-like modules (same as main branch)
  - package-ecosystem: npm
    target-branch: release-5.0
    directory: /
    commit-message:
      prefix: '[release-5.0] maintenance'
    cooldown:
      default-days: 5
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: UTC
    ignore:
      - dependency-name: '@openshift/dynamic-plugin-sdk'
      - dependency-name: '@openshift-console/dynamic-plugin-sdk'
      - dependency-name: '@openshift-console/dynamic-plugin-sdk-internal'
      - dependency-name: '@patternfly/*'
      - dependency-name: react
      - dependency-name: react-i18next
      - dependency-name: react-redux
      - dependency-name: react-router
      - dependency-name: react-router-dom
      - dependency-name: react-router-dom-v5-compat
      - dependency-name: redux
      - dependency-name: redux-thunk
      - dependency-name: '@openshift-console/dynamic-plugin-sdk-webpack'
      - dependency-name: '@openshift/dynamic-plugin-sdk-webpack'
    allow:
      - dependency-type: all
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      npm:
        patterns:
          - '*'
  
  - package-ecosystem: npm
    target-branch: release-4.22
    directory: /
    commit-message:
