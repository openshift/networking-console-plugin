apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: nad-cnv-bridge
  namespace: ${NAD_NS}
  annotations:
    k8s.v1.cni.cncf.io/resourceName: bridge.network.kubevirt.io/br0
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "nad-cnv-bridge",
      "type": "cnv-bridge",
      "bridge": "br0",
      "macspoofchk": true,
      "vlan": 100
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: nad-ovn
  namespace: ${NAD_NS}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "nad-ovn",
      "type": "ovn-k8s-cni-overlay",
      "topology": "layer2",
      "netAttachDefName": "${NAD_NS}/nad-ovn",
      "subnets": "10.220.0.0/24"
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: nad-sriov
  namespace: ${NAD_NS}
  annotations:
    k8s.v1.cni.cncf.io/resourceName: openshift.io/sriov_net
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "nad-sriov",
      "type": "sriov",
      "vlan": 200,
      "ipam": {}
    }
---
apiVersion: k8s.ovn.org/v1
kind: UserDefinedNetwork
metadata:
  name: udn-with-nad
  namespace: ${UDN_NS}
spec:
  topology: Layer2
  layer2:
    role: Primary
    subnets:
      - 10.221.0.0/24
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: test-cudn-nad
spec:
  namespaceSelector:
    matchLabels:
      e2e.networking-console-plugin/cudn-31: member
  network:
    topology: Layer2
    layer2:
      role: Primary
      subnets:
        - 10.222.0.0/24
