apiVersion: v1
kind: Namespace
metadata:
  name: ocpnetui-31-empty
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ocpnetui-31-empty
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: Namespace
metadata:
  name: ocpnetui-31-nads
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ocpnetui-31-nads
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: Namespace
metadata:
  name: ocpnetui-31-udn
  labels:
    k8s.ovn.org/primary-user-defined-network: ''
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ocpnetui-31-udn
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: Namespace
metadata:
  name: ocpnetui-31-cudn
  labels:
    ocpnetui-31/cudn: member
    k8s.ovn.org/primary-user-defined-network: ''
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ocpnetui-31-cudn
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: nad-cnv-bridge
  namespace: ocpnetui-31-nads
  annotations:
    k8s.v1.cni.cncf.io/resourceName: bridge.network.kubevirt.io/br0
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "nad-cnv-bridge",
      "type": "cnv-bridge",
      "bridge": "br0",
      "macspoofchk": true,
      "vlan": 100
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: nad-ovn
  namespace: ocpnetui-31-nads
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "nad-ovn",
      "type": "ovn-k8s-cni-overlay",
      "topology": "layer2",
      "netAttachDefName": "ocpnetui-31-nads/nad-ovn",
      "subnets": "10.220.0.0/24"
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: nad-sriov
  namespace: ocpnetui-31-nads
  annotations:
    k8s.v1.cni.cncf.io/resourceName: openshift.io/sriov_net
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "nad-sriov",
      "type": "sriov",
      "vlan": 200,
      "ipam": {}
    }
---
apiVersion: k8s.ovn.org/v1
kind: UserDefinedNetwork
metadata:
  name: udn-with-nad
  namespace: ocpnetui-31-udn
spec:
  topology: Layer2
  layer2:
    role: Primary
    subnets:
      - 10.221.0.0/24
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: test-cudn-nad
spec:
  namespaceSelector:
    matchLabels:
      ocpnetui-31/cudn: member
  network:
    topology: Layer2
    layer2:
      role: Primary
      subnets:
        - 10.222.0.0/24
