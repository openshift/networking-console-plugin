apiVersion: k8s.ovn.org/v1
kind: UserDefinedNetwork
metadata:
  name: udn-layer2
  namespace: ${UDN_NS}
spec:
  topology: Layer2
  layer2:
    role: Primary
    subnets:
      - 10.210.0.0/24
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: test-cudn-localnet
spec:
  namespaceSelector:
    matchLabels:
      e2e.networking-console-plugin/localnet: member
  network:
    topology: Localnet
    localnet:
      role: Secondary
      physicalNetworkName: physnet-ocpnetui-18
      ipam:
        mode: Disabled
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: test-cudn-topo
spec:
  namespaceSelector:
    matchLabels:
      e2e.networking-console-plugin/cudn: member
  network:
    topology: Layer2
    layer2:
      role: Primary
      subnets:
        - 10.211.0.0/24
