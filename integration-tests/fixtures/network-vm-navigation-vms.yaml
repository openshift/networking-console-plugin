apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-nad-1
  namespace: ocpnetui-14-nad
spec:
  runStrategy: Halted
  template:
    spec:
      domain:
        devices:
          disks:
          - disk:
              bus: virtio
            name: rootdisk
          interfaces:
          - bridge: {}
            name: default
          - bridge: {}
            name: net-iface
        machine:
          type: q35
        resources:
          requests:
            memory: 512Mi
      networks:
      - name: default
        pod: {}
      - multus:
          networkName: ocpnetui-14-nad/nad-with-vms
        name: net-iface
      volumes:
      - containerDisk:
          image: quay.io/kubevirt/cirros-container-disk-demo
        name: rootdisk
---
