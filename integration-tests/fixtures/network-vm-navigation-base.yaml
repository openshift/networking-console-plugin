apiVersion: v1
kind: Namespace
metadata:
  name: ocpnetui-14-nad
---
apiVersion: v1
kind: Namespace
metadata:
  name: ocpnetui-14-udn
  labels:
    k8s.ovn.org/primary-user-defined-network: ''
---
apiVersion: v1
kind: Namespace
metadata:
  name: ocpnetui-14-cudn-a
  labels:
    ocpnetui-14/cudn: member
---
apiVersion: v1
kind: Namespace
metadata:
  name: ocpnetui-14-cudn-b
  labels:
    ocpnetui-14/cudn: member
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: nad-empty
  namespace: ocpnetui-14-nad
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "nad-empty",
      "type": "bridge",
      "bridge": "br0"
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: nad-with-vms
  namespace: ocpnetui-14-nad
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "nad-with-vms",
      "type": "bridge",
      "bridge": "br0"
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: nad-multi
  namespace: ocpnetui-14-nad
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "nad-multi",
      "type": "bridge",
      "bridge": "br0"
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: nad-paged
  namespace: ocpnetui-14-nad
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "nad-paged",
      "type": "bridge",
      "bridge": "br0"
    }
---
apiVersion: k8s.ovn.org/v1
kind: UserDefinedNetwork
metadata:
  name: test-udn-empty
  namespace: ocpnetui-14-udn
spec:
  topology: Layer2
  layer2:
    role: Primary
    subnets:
      - 10.200.0.0/24
---
apiVersion: k8s.ovn.org/v1
kind: UserDefinedNetwork
metadata:
  name: test-udn
  namespace: ocpnetui-14-udn
spec:
  topology: Layer2
  layer2:
    role: Primary
    subnets:
      - 10.201.0.0/24
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: test-cudn
spec:
  namespaceSelector:
    matchLabels:
      ocpnetui-14/cudn: member
  network:
    topology: Layer2
    layer2:
      role: Primary
      subnets:
        - 10.202.0.0/24
